<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THISISFIS</title>
  <meta name="description" content="THISISFIS — принты, мерч, медиа, архив и эксперименты." />
  <meta name="robots" content="index, follow" />
  <style>
    :root {
      --bg: #070707;
      --fg: #f2f0ea;
      --muted: #8c8a82;
      --line: rgba(242, 240, 234, 0.16);
      --soft: rgba(242, 240, 234, 0.055);
      --ai333: #7157ff;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: var(--bg); }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: -0.02em;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(20px, 4vw, 44px);
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(circle at 18% 22%, rgba(255,255,255,0.08), transparent 28%),
        radial-gradient(circle at 82% 78%, rgba(255,255,255,0.055), transparent 32%),
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: auto, auto, 42px 42px, 42px 42px;
    }

    .page::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(7,7,7,0.2), rgba(7,7,7,0.86));
    }

    header, footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1280px;
      padding: 8vh 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(58px, 15vw, 190px);
      line-height: 0.82;
      letter-spacing: -0.095em;
      text-transform: uppercase;
      font-weight: 900;
    }

    .tagline {
      margin-top: clamp(22px, 4vw, 38px);
      max-width: 820px;
      font-size: clamp(19px, 3.2vw, 42px);
      line-height: 1.02;
      text-transform: uppercase;
    }

    .status {
      margin-top: 26px;
      width: fit-content;
      border: 1px solid var(--line);
      padding: 11px 13px;
      color: var(--muted);
      background: var(--soft);
      font-size: 12px;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    footer {
      align-items: flex-end;
      border-top: 1px solid var(--line);
      padding-top: 18px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: flex-end;
      align-items: center;
    }

    a {
      color: var(--fg);
      text-decoration: none;
    }

    a:focus-visible {
      outline: 1px solid rgba(242, 240, 234, 0.5);
      outline-offset: 4px;
    }

    /* ИИ В 3:33 НОЧИ — broken retro clock */
    .ai333-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 68px;
      height: 34px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      color: #aaa8a1;
      background: rgba(242, 240, 234, 0.035);
      filter: grayscale(1);
      transition:
        color .18s ease,
        border-color .18s ease,
        background .18s ease,
        box-shadow .18s ease,
        filter .18s ease,
        transform .18s ease;
    }

    .ai333-link::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .28;
      background: repeating-linear-gradient(
        180deg,
        transparent 0,
        transparent 3px,
        rgba(255,255,255,.045) 4px
      );
    }

    .ai333-clock {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: .035em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 7px rgba(255,255,255,.08);
    }

    .ai333-colon {
      display: inline-block;
      margin: 0 .02em;
      animation: ai333Colon 1s steps(1, end) infinite;
    }

    .ai333-minutes {
      display: inline-block;
      min-width: 2.05ch;
      transform-origin: 50% 50%;
    }

    .ai333-link:hover,
    .ai333-link:focus-visible,
    .ai333-link:active {
      color: var(--ai333);
      border-color: rgba(113, 87, 255, .58);
      background: rgba(113, 87, 255, .08);
      box-shadow:
        0 0 0 1px rgba(113,87,255,.06) inset,
        0 0 18px rgba(113,87,255,.16);
      filter: grayscale(0);
      transform: translateY(-1px);
      outline: none;
    }

    .ai333-link:hover .ai333-clock,
    .ai333-link:focus-visible .ai333-clock,
    .ai333-link:active .ai333-clock {
      text-shadow:
        0 0 6px rgba(113,87,255,.55),
        0 0 14px rgba(113,87,255,.25);
    }

    .ai333-link.is-breaking .ai333-minutes {
      animation: ai333Break 170ms steps(2, end) both;
    }

    .ai333-link.is-breaking .ai333-clock {
      animation: ai333Jitter 170ms steps(2, end) both;
    }

    @keyframes ai333Colon {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: .28; }
    }

    @keyframes ai333Break {
      0%   { opacity: 1; transform: translateY(0) skewX(0); }
      30%  { opacity: .38; transform: translateY(-2px) skewX(-8deg); }
      62%  { opacity: 1; transform: translateY(1px) skewX(5deg); }
      100% { opacity: 1; transform: translateY(0) skewX(0); }
    }

    @keyframes ai333Jitter {
      0%   { transform: translateX(0); }
      30%  { transform: translateX(-1px); }
      62%  { transform: translateX(1px); }
      100% { transform: translateX(0); }
    }

    .apps {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: 2px;
    }

    .app-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      opacity: 0.72;
      cursor: default;
      user-select: none;
      pointer-events: none;
      white-space: nowrap;
      letter-spacing: 0.08em;
    }

    .app-icon {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--soft);
      color: var(--fg);
      overflow: hidden;
    }

    .app-icon svg {
      width: 21px;
      height: 21px;
      display: block;
    }

    .app-name {
      font-size: 10px;
      line-height: 1;
    }

    .freedom-mark .body,
    .freedom-mark .shackle,
    .freedom-mark .keyline,
    .flip-mark .stroke {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .flip-mark .dot { fill: currentColor; }

    @media (prefers-reduced-motion: reduce) {
      .ai333-colon,
      .ai333-link.is-breaking .ai333-minutes,
      .ai333-link.is-breaking .ai333-clock {
        animation: none;
      }
    }

    @media (max-width: 700px) {
      header, footer {
        flex-direction: column;
        align-items: flex-start;
      }

      nav { justify-content: flex-start; }
      main { padding: 10vh 0; }

      .apps {
        width: 100%;
        gap: 12px;
      }

      .app-name { display: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>THISISFIS / МОСКВА</div>
      <div>АРХИВНЫЙ РЕЖИМ</div>
    </header>

    <main>
      <h1>THISISFIS</h1>
      <div class="tagline">ПРИНТЫ / МЕРЧ / МЕДИА / АРХИВ / ЭКСПЕРИМЕНТЫ</div>
      <div class="status">САЙТ ОБНОВЛЯЕТСЯ</div>
    </main>

    <footer>
      <div>ВРЕМЕННАЯ СТРАНИЦА</div>
      <nav aria-label="Ссылки и приложения">
        <a
          class="ai333-link"
          id="ai333Link"
          href="https://t.me/iamandai"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Телеграм-канал «ИИ В 3:33 НОЧИ»"
          title="ИИ В 3:33 НОЧИ"
        >
          <span class="ai333-clock" aria-hidden="true">
            <span>3</span><span class="ai333-colon">:</span><span class="ai333-minutes" id="ai333Minutes">33</span>
          </span>
        </a>

        <div class="apps" aria-label="Приложения">
          <span class="app-item" aria-label="ThisisFreedom — приложение, ссылка отключена" title="ThisisFreedom">
            <span class="app-icon" aria-hidden="true">
              <svg class="freedom-mark" viewBox="0 0 24 24">
                <path class="shackle" d="M8.2 10V7.8a3.8 3.8 0 0 1 7.6 0V10"></path>
                <rect class="body" x="6.4" y="10" width="11.2" height="8.8" rx="2.1"></rect>
                <path class="keyline" d="M12 13.2v2.5"></path>
              </svg>
            </span>
            <span class="app-name">THISISFREEDOM</span>
          </span>

          <span class="app-item" aria-label="ThisisFlip — приложение, ссылка отключена" title="ThisisFlip">
            <span class="app-icon" aria-hidden="true">
              <svg class="flip-mark" viewBox="0 0 24 24">
                <path class="stroke" d="M5.2 6.2v11.6h5.2"></path>
                <path class="stroke" d="M18.8 17.8V6.2h-5.2"></path>
                <circle class="dot" cx="8.2" cy="6.2" r="1.25"></circle>
                <circle class="dot" cx="15.8" cy="17.8" r="1.25"></circle>
              </svg>
            </span>
            <span class="app-name">THISISFLIP</span>
          </span>
        </div>
      </nav>
    </footer>
  </div>

  <script>
    (() => {
      const link = document.getElementById('ai333Link');
      const minutes = document.getElementById('ai333Minutes');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (!link || !minutes || reduceMotion) return;

      const breakClock = () => {
        minutes.textContent = '34';
        link.classList.add('is-breaking');

        window.setTimeout(() => {
          minutes.textContent = '33';
          link.classList.remove('is-breaking');
        }, 170);
      };

      window.setInterval(breakClock, 1000);
    })();
  </script>
</body>
</html>
