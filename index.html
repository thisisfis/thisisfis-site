<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THISISFIS</title>
  <meta name="description" content="THISISFIS — принты, мерч, медиа, архив и эксперименты." />
  <meta name="robots" content="index, follow" />
  <style>
    :root {
      --bg: #070707;
      --fg: #f2f0ea;
      --muted: #8c8a82;
      --line: rgba(242, 240, 234, 0.16);
      --soft: rgba(242, 240, 234, 0.055);
      --ai333: #7157ff;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: var(--bg); }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: -0.02em;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(20px, 4vw, 44px);
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(circle at 18% 22%, rgba(255,255,255,0.08), transparent 28%),
        radial-gradient(circle at 82% 78%, rgba(255,255,255,0.055), transparent 32%),
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: auto, auto, 42px 42px, 42px 42px;
    }

    .page::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(7,7,7,0.2), rgba(7,7,7,0.86));
    }

    header, footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1280px;
      padding: 8vh 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(58px, 15vw, 190px);
      line-height: 0.82;
      letter-spacing: -0.095em;
      text-transform: uppercase;
      font-weight: 900;
    }

    .tagline {
      margin-top: clamp(22px, 4vw, 38px);
      max-width: 820px;
      font-size: clamp(19px, 3.2vw, 42px);
      line-height: 1.02;
      text-transform: uppercase;
    }

    .status {
      margin-top: 26px;
      width: fit-content;
      border: 1px solid var(--line);
      padding: 11px 13px;
      color: var(--muted);
      background: var(--soft);
      font-size: 12px;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    footer {
      align-items: flex-end;
      border-top: 1px solid var(--line);
      padding-top: 18px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: flex-end;
      align-items: center;
    }

    a {
      color: var(--fg);
      text-decoration: none;
    }

    a:focus-visible {
      outline: 1px solid rgba(242, 240, 234, 0.5);
      outline-offset: 4px;
    }

    /* ИИ В 3:33 НОЧИ — seven-segment clock mark */
    .ai333-link {
      display: inline-flex;
      align-items: center;
      color: #aaa8a1;
      filter: grayscale(1);
      padding: 2px 0;
      transition: color .18s ease, filter .18s ease, transform .18s ease;
    }

    .ai333-clock {
      display: inline-flex;
      align-items: center;
      gap: 1px;
      line-height: 1;
    }

    .seg-digit {
      width: 18px;
      height: 30px;
      display: block;
      flex: 0 0 auto;
      overflow: visible;
    }

    .seg-digit .segment {
      fill: currentColor;
      opacity: .055;
      transition: opacity 45ms linear, filter .18s ease;
    }

    .seg-digit[data-digit="3"] .seg-a,
    .seg-digit[data-digit="3"] .seg-b,
    .seg-digit[data-digit="3"] .seg-c,
    .seg-digit[data-digit="3"] .seg-d,
    .seg-digit[data-digit="3"] .seg-g,
    .seg-digit[data-digit="4"] .seg-b,
    .seg-digit[data-digit="4"] .seg-c,
    .seg-digit[data-digit="4"] .seg-f,
    .seg-digit[data-digit="4"] .seg-g {
      opacity: .94;
    }

    .ai333-colon {
      width: 7px;
      height: 30px;
      position: relative;
      flex: 0 0 7px;
      opacity: .88;
      animation: ai333Colon 1s steps(1, end) infinite;
    }

    .ai333-colon::before,
    .ai333-colon::after {
      content: "";
      position: absolute;
      left: 2px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: currentColor;
    }

    .ai333-colon::before { top: 9px; }
    .ai333-colon::after { bottom: 9px; }

    .ai333-am {
      margin-left: 4px;
      margin-top: 1px;
      font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: -.035em;
      line-height: 1;
      opacity: .72;
      align-self: center;
    }

    .ai333-link:hover,
    .ai333-link:focus-visible,
    .ai333-link:active {
      color: var(--ai333);
      filter: grayscale(0);
      transform: translateY(-1px);
      outline: none;
    }

    .ai333-link:hover .seg-digit .segment,
    .ai333-link:focus-visible .seg-digit .segment,
    .ai333-link:active .seg-digit .segment {
      filter: drop-shadow(0 0 3px rgba(113,87,255,.66));
    }

    .ai333-link:hover .ai333-colon,
    .ai333-link:focus-visible .ai333-colon,
    .ai333-link:active .ai333-colon,
    .ai333-link:hover .ai333-am,
    .ai333-link:focus-visible .ai333-am,
    .ai333-link:active .ai333-am {
      text-shadow: 0 0 7px rgba(113,87,255,.46);
    }

    .ai333-link.is-breaking .ai333-clock {
      animation: ai333Jitter 180ms steps(2, end) both;
    }

    .ai333-link.is-breaking .seg-digit:last-of-type {
      animation: ai333Flicker 180ms steps(2, end) both;
    }

    @keyframes ai333Colon {
      0%, 49% { opacity: .9; }
      50%, 100% { opacity: .34; }
    }

    @keyframes ai333Jitter {
      0%   { transform: translateX(0); }
      28%  { transform: translateX(-1px); }
      62%  { transform: translateX(1px); }
      100% { transform: translateX(0); }
    }

    @keyframes ai333Flicker {
      0%   { opacity: 1; }
      28%  { opacity: .28; }
      58%  { opacity: .9; }
      78%  { opacity: .42; }
      100% { opacity: 1; }
    }

    .apps {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: 2px;
    }

    .app-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      opacity: 0.72;
      cursor: default;
      user-select: none;
      pointer-events: none;
      white-space: nowrap;
      letter-spacing: 0.08em;
    }

    .app-icon {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--soft);
      color: var(--fg);
      overflow: hidden;
    }

    .app-icon svg {
      width: 21px;
      height: 21px;
      display: block;
    }

    .app-name {
      font-size: 10px;
      line-height: 1;
    }

    .freedom-mark .body,
    .freedom-mark .shackle,
    .freedom-mark .keyline,
    .flip-mark .stroke {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .flip-mark .dot { fill: currentColor; }

    @media (prefers-reduced-motion: reduce) {
      .ai333-colon,
      .ai333-link.is-breaking .ai333-clock,
      .ai333-link.is-breaking .seg-digit:last-of-type {
        animation: none;
      }
    }

    @media (max-width: 700px) {
      header, footer {
        flex-direction: column;
        align-items: flex-start;
      }

      nav { justify-content: flex-start; }
      main { padding: 10vh 0; }

      .apps {
        width: 100%;
        gap: 12px;
      }

      .app-name { display: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>THISISFIS / МОСКВА</div>
      <div>АРХИВНЫЙ РЕЖИМ</div>
    </header>

    <main>
      <h1>THISISFIS</h1>
      <div class="tagline">ПРИНТЫ / МЕРЧ / МЕДИА / АРХИВ / ЭКСПЕРИМЕНТЫ</div>
      <div class="status">САЙТ ОБНОВЛЯЕТСЯ</div>
    </main>

    <footer>
      <div>ВРЕМЕННАЯ СТРАНИЦА</div>
      <nav aria-label="Ссылки и приложения">
        <a
          class="ai333-link"
          id="ai333Link"
          href="https://t.me/iamandai"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Телеграм-канал «ИИ В 3:33 НОЧИ»"
          title="ИИ В 3:33 НОЧИ"
        >
          <span class="ai333-clock" aria-hidden="true">
            <svg class="seg-digit" viewBox="0 0 20 34" data-digit="3">
              <path class="segment seg-a" d="M4 1.5h12l2 2.1-2 2.1H4L2 3.6z"/>
              <path class="segment seg-b" d="M16.4 5.7l2.1-2 1 1.8v10.2l-2 2-1.1-1.1z"/>
              <path class="segment seg-c" d="M17.5 17l2 2v10.1l-1.9 1.9-1.2-1.1V18.1z"/>
              <path class="segment seg-d" d="M4 28.6h12l2 2.1-2 2.1H4l-2-2.1z"/>
              <path class="segment seg-e" d="M.5 19l2-2 1.1 1.1v11.8L2.4 31 .5 29.1z"/>
              <path class="segment seg-f" d="M2.4 3.7l1.2 1.1v11.8L2.5 17.7l-2-2V5.5z"/>
              <path class="segment seg-g" d="M4 15.1h12l2 1.9-2 1.9H4L2 17z"/>
            </svg>
            <span class="ai333-colon"></span>
            <svg class="seg-digit" viewBox="0 0 20 34" data-digit="3">
              <path class="segment seg-a" d="M4 1.5h12l2 2.1-2 2.1H4L2 3.6z"/>
              <path class="segment seg-b" d="M16.4 5.7l2.1-2 1 1.8v10.2l-2 2-1.1-1.1z"/>
              <path class="segment seg-c" d="M17.5 17l2 2v10.1l-1.9 1.9-1.2-1.1V18.1z"/>
              <path class="segment seg-d" d="M4 28.6h12l2 2.1-2 2.1H4l-2-2.1z"/>
              <path class="segment seg-e" d="M.5 19l2-2 1.1 1.1v11.8L2.4 31 .5 29.1z"/>
              <path class="segment seg-f" d="M2.4 3.7l1.2 1.1v11.8L2.5 17.7l-2-2V5.5z"/>
              <path class="segment seg-g" d="M4 15.1h12l2 1.9-2 1.9H4L2 17z"/>
            </svg>
            <svg class="seg-digit" id="ai333LastDigit" viewBox="0 0 20 34" data-digit="3">
              <path class="segment seg-a" d="M4 1.5h12l2 2.1-2 2.1H4L2 3.6z"/>
              <path class="segment seg-b" d="M16.4 5.7l2.1-2 1 1.8v10.2l-2 2-1.1-1.1z"/>
              <path class="segment seg-c" d="M17.5 17l2 2v10.1l-1.9 1.9-1.2-1.1V18.1z"/>
              <path class="segment seg-d" d="M4 28.6h12l2 2.1-2 2.1H4l-2-2.1z"/>
              <path class="segment seg-e" d="M.5 19l2-2 1.1 1.1v11.8L2.4 31 .5 29.1z"/>
              <path class="segment seg-f" d="M2.4 3.7l1.2 1.1v11.8L2.5 17.7l-2-2V5.5z"/>
              <path class="segment seg-g" d="M4 15.1h12l2 1.9-2 1.9H4L2 17z"/>
            </svg>
            <span class="ai333-am">AM</span>
          </span>
        </a>

        <div class="apps" aria-label="Приложения">
          <span class="app-item" aria-label="ThisisFreedom — приложение, ссылка отключена" title="ThisisFreedom">
            <span class="app-icon" aria-hidden="true">
              <svg class="freedom-mark" viewBox="0 0 24 24">
                <path class="shackle" d="M8.2 10V7.8a3.8 3.8 0 0 1 7.6 0V10"></path>
                <rect class="body" x="6.4" y="10" width="11.2" height="8.8" rx="2.1"></rect>
                <path class="keyline" d="M12 13.2v2.5"></path>
              </svg>
            </span>
            <span class="app-name">THISISFREEDOM</span>
          </span>

          <span class="app-item" aria-label="ThisisFlip — приложение, ссылка отключена" title="ThisisFlip">
            <span class="app-icon" aria-hidden="true">
              <svg class="flip-mark" viewBox="0 0 24 24">
                <path class="stroke" d="M5.2 6.2v11.6h5.2"></path>
                <path class="stroke" d="M18.8 17.8V6.2h-5.2"></path>
                <circle class="dot" cx="8.2" cy="6.2" r="1.25"></circle>
                <circle class="dot" cx="15.8" cy="17.8" r="1.25"></circle>
              </svg>
            </span>
            <span class="app-name">THISISFLIP</span>
          </span>
        </div>
      </nav>
    </footer>
  </div>

  <script>
    (() => {
      const link = document.getElementById('ai333Link');
      const lastDigit = document.getElementById('ai333LastDigit');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (!link || !lastDigit || reduceMotion) return;

      const breakClock = () => {
        lastDigit.setAttribute('data-digit', '4');
        link.classList.add('is-breaking');

        window.setTimeout(() => {
          lastDigit.setAttribute('data-digit', '3');
          link.classList.remove('is-breaking');
        }, 180);
      };

      window.setInterval(breakClock, 1000);
    })();
  </script>
</body>
</html>
