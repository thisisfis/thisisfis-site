<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THISISFIS</title>
  <meta name="description" content="THISISFIS — принты, мерч, медиа, архив и эксперименты." />
  <meta name="robots" content="index, follow" />
  <style>
    :root {
      --bg: #070707;
      --fg: #f2f0ea;
      --muted: #8c8a82;
      --line: rgba(242, 240, 234, 0.16);
      --soft: rgba(242, 240, 234, 0.055);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: var(--bg); }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: -0.02em;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(20px, 4vw, 44px);
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(circle at 18% 22%, rgba(255,255,255,0.08), transparent 28%),
        radial-gradient(circle at 82% 78%, rgba(255,255,255,0.055), transparent 32%),
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: auto, auto, 42px 42px, 42px 42px;
    }

    .page::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(7,7,7,0.2), rgba(7,7,7,0.86));
    }

    header, footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1280px;
      padding: 8vh 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(58px, 15vw, 190px);
      line-height: 0.82;
      letter-spacing: -0.095em;
      text-transform: uppercase;
      font-weight: 900;
    }

    .tagline {
      margin-top: clamp(22px, 4vw, 38px);
      max-width: 820px;
      font-size: clamp(19px, 3.2vw, 42px);
      line-height: 1.02;
      text-transform: uppercase;
    }

    .status {
      margin-top: 26px;
      width: fit-content;
      border: 1px solid var(--line);
      padding: 11px 13px;
      color: var(--muted);
      background: var(--soft);
      font-size: 12px;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    footer {
      align-items: flex-end;
      border-top: 1px solid var(--line);
      padding-top: 18px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: flex-end;
      align-items: center;
    }

    a {
      color: var(--fg);
      text-decoration: none;
      border-bottom: 1px solid rgba(242, 240, 234, 0.34);
    }

    a:hover, a:focus-visible {
      border-bottom-color: var(--fg);
      outline: none;
    }

    .apps {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: 2px;
    }

    .app-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      opacity: 0.72;
      cursor: default;
      user-select: none;
      pointer-events: none;
      white-space: nowrap;
      letter-spacing: 0.08em;
    }

    .app-icon {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--soft);
      color: var(--fg);
      overflow: hidden;
    }

    .app-icon svg {
      width: 21px;
      height: 21px;
      display: block;
    }

    .app-name {
      font-size: 10px;
      line-height: 1;
    }

    .freedom-mark .body,
    .freedom-mark .shackle,
    .freedom-mark .keyline,
    .flip-mark .stroke {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .flip-mark .dot { fill: currentColor; }

    @media (max-width: 700px) {
      header, footer {
        flex-direction: column;
        align-items: flex-start;
      }

      nav { justify-content: flex-start; }
      main { padding: 10vh 0; }

      .apps {
        width: 100%;
        gap: 12px;
      }

      .app-name { display: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>THISISFIS / МОСКВА</div>
      <div>АРХИВНЫЙ РЕЖИМ</div>
    </header>

    <main>
      <h1>THISISFIS</h1>
      <div class="tagline">ПРИНТЫ / МЕРЧ / МЕДИА / АРХИВ / ЭКСПЕРИМЕНТЫ</div>
      <div class="status">САЙТ ОБНОВЛЯЕТСЯ</div>
    </main>

    <footer>
      <div>ВРЕМЕННАЯ СТРАНИЦА</div>
      <nav aria-label="Ссылки и приложения">
        <a href="#" aria-label="Телеграм">ТЕЛЕГРАМ</a>
        <div class="apps" aria-label="Приложения">
          <span class="app-item" aria-label="ThisisFreedom — приложение, ссылка отключена" title="ThisisFreedom">
            <span class="app-icon" aria-hidden="true">
              <svg class="freedom-mark" viewBox="0 0 24 24">
                <path class="shackle" d="M8.2 10V7.8a3.8 3.8 0 0 1 7.6 0V10"></path>
                <rect class="body" x="6.4" y="10" width="11.2" height="8.8" rx="2.1"></rect>
                <path class="keyline" d="M12 13.2v2.5"></path>
              </svg>
            </span>
            <span class="app-name">THISISFREEDOM</span>
          </span>

          <span class="app-item" aria-label="ThisisFlip — приложение, ссылка отключена" title="ThisisFlip">
            <span class="app-icon" aria-hidden="true">
              <svg class="flip-mark" viewBox="0 0 24 24">
                <path class="stroke" d="M5.2 6.2v11.6h5.2"></path>
                <path class="stroke" d="M18.8 17.8V6.2h-5.2"></path>
                <circle class="dot" cx="8.2" cy="6.2" r="1.25"></circle>
                <circle class="dot" cx="15.8" cy="17.8" r="1.25"></circle>
              </svg>
            </span>
            <span class="app-name">THISISFLIP</span>
          </span>
        </div>
      </nav>
    </footer>
  </div>
</body>
</html>
